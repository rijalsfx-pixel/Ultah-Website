
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Memories 📸</title>
    <link rel="stylesheet" href="page4.css">
</head>
<body>

    <main class="container">

        <h1>Our Little Memories ♡</h1>
        <p class="subtitle">Every picture has a story to tell.</p>
		

        <div class="camera">

            <div class="camera-top">
                <div class="viewfinder"></div>
                <div class="camera-brand">OUR MEMORIES</div>
                <div class="flash"></div>
            </div>

            <div class="camera-screen">

                <div class="screen-header">
                    <span>● REC</span>
                    <span id="photoNumber">1 / 5</span>
                </div>

                <div class="photo-area">
                    <img id="memoryPhoto"
                         src="assets/memories/foto2.jpg"
                         alt="Our Memory">
                </div>

                <div class="photo-caption">
                    <p id="photoCaption">Our favorite moment ♡</p>
                </div>

            </div>

            <div class="camera-bottom">

                <button class="nav-button" onclick="previousPhoto()">
                    ◀
                </button>

                <div class="lens">
                    <div class="lens-inner"></div>
                </div>

                <button class="nav-button" onclick="nextPhoto()">
                    ▶
                </button>

            </div>

            <div class="camera-decoration">
                <span>♡</span>
                <span>♡</span>
                <span>♡</span>
            </div>

        </div>

        <p class="instruction">
            Use the buttons to see our memories 💗
        </p>

        <div class="navigation">
            <a href="page2.html">← Previous</a>
			<a href="page5.html" class="next-page">Next → ♡</a>
        </div>
		
		

    </main>

    <script src="page4.js"></script>
</body>
</html>
